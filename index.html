  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"
/>
<title>Morning Brief Dashboard</title>
<style>
:root {
--bg: #0f172a;
--card-bg: #1e293b;
--accent: #2563eb;
--text: #f8fafc;
--text-muted: #94a3b8;
--border: #334155;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
Roboto, sans-serif;
background-color: var(--bg);
color: var(--text);
padding: 20px;
max-width: 850px;
margin: 0 auto;
}
header { margin-bottom: 20px; }
h1 { font-size: 1.75rem; color: #38bdf8; margin-bottom: 4px; }
.subtitle { color: var(--text-muted); font-size: 0.95rem; }
.grid { display: grid; gap: 16px; margin-top: 16px; }
.card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 8px;
padding: 16px;
}
.label {
font-weight: 600;
color: #cbd5e1;
margin-bottom: 8px;
}
.metrics { display: flex; gap: 12px; margin-top: 8px; }
.metric-box {
background: rgba(0, 0, 0, 0.2);
border-radius: 6px;
padding: 10px;
flex: 1;
}
.metric-title { font-size: 0.8rem; color: var(--text-muted); }
.metric-value { font-size: 1.1rem; font-weight: bold; color:
#38bdf8; margin-top: 2px; }
textarea {
width: 100%;
height: 90px;
background: rgba(0, 0, 0, 0.3);
border: 1px solid var(--border);
border-radius: 6px;
color: var(--text);
padding: 8px;
font-family: inherit;
resize: vertical;
margin-top: 8px;
}
.btn-group { display: flex; gap: 8px; margin-top: 8px; }
button {
padding: 6px 14px;
border: none;
border-radius: 4px;
font-weight: 600;
cursor: pointer;
}
.btn-save { background: #2563eb; color: white; }
.btn-clear { background: #ef4444; color: white; }
.log-box {
margin-top: 8px;
padding: 8px;
background: rgba(0, 0, 0, 0.2);
border-radius: 6px;
font-size: 0.85rem;
color: var(--text-muted);
min-height: 40px;
white-space: pre-wrap;
}
</style>
</head>
<body>

<header>
<h1>Morning Brief</h1>
<div class="subtitle" id="clock">Loading current time...</div>
</header>

<div class="card">
<div class="label">System Overview</div>
<div class="metrics">
<div class="metric-box">
<div class="metric-title">System Mode</div>
<div class="metric-value">Active</div>
</div>
<div class="metric-box">
<div class="metric-title">Alert Level</div>
<div class="metric-value">Normal</div>
</div>
<div class="metric-box">
<div class="metric-title">Refresh Interval</div>
<div class="metric-value">60s</div>
</div>
</div>
</div>

<div class="grid">
<div class="card">
<div class="label">⭐ AI Research Box</div>
<textarea id="ai-input" placeholder="Paste article, idea, note, or
text here..."></textarea>
<div class="btn-group">
<button class="btn-save" id="ai-save">Save</button>
<button class="btn-clear" id="ai-clear">Clear</button>
</div>
<div style="margin-top: 12px; font-weight: 600; font-size:
0.9rem;">Saved Research Log</div>
<div class="log-box" id="ai-log">No saved research yet.</div>
</div>
</div>

<script>
function updateClock() {
const now = new Date();
document.getElementById('clock').textContent =
now.toLocaleDateString('en-US', {
weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
hour: 'numeric', minute: '2-digit', second: '2-digit'
});
}
setInterval(updateClock, 1000);
updateClock();

const aiLog = document.getElementById("ai-log");
const aiInput = document.getElementById("ai-input");

function loadResearch() {
const saved = localStorage.getItem("aiResearchLog");
aiLog.textContent = saved ? saved : "No saved research yet.";
}
loadResearch();

document.getElementById("ai-save").onclick = () => {
const text = aiInput.value.trim();
if (!text) return;
const existing = localStorage.getItem("aiResearchLog") || "";
const timestamp = new Date().toLocaleTimeString([], { hour:
'2-digit', minute: '2-digit' });
const entry = `[${timestamp}] ${text}`;
const updated = existing ? existing + "\n\n--- \n\n" + entry :
entry;
localStorage.setItem("aiResearchLog", updated);
aiInput.value = "";
loadResearch();
};

document.getElementById("ai-clear").onclick = () => {
localStorage.removeItem("aiResearchLog");
aiInput.value = "";
loadResearch();
};
</script>
<script src="scripts/main.js"></script>
</body>
</html>
